name: Clack-Basic CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Toolchain Info
        run: |
          echo "🚀 Running on Popel ARM64 Forgejo Runner"
          go version

      - name: Run Go Unit Tests
        run: |
          go test -v ./...

      - name: Compile Binary
        run: |
          go build -v -o bin/clack .
          ls -lh bin/clack
