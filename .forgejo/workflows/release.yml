name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          go version
          go test -v ./...

      - name: Compile Multiplatform Binaries
        run: |
          mkdir -p dist-bin
          # Linux x86_64
          GOOS=linux GOARCH=amd64 go build -o dist-bin/clack .
          cp dist-bin/clack dist-bin/clack-linux-amd64
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o dist-bin/clack-linux-arm64 .
          # Windows x64
          GOOS=windows GOARCH=amd64 go build -o dist-bin/clack.exe .
          cp dist-bin/clack.exe dist-bin/clack-windows-amd64.exe
          # macOS Apple Silicon & Intel
          GOOS=darwin GOARCH=arm64 go build -o dist-bin/clack-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist-bin/clack-darwin-amd64 .
          ls -lh dist-bin/

      - name: Publish Release to Forgejo
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          API_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          echo "==> Creating Release $TAG on Forgejo..."
          RESP=$(curl -k -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Release $TAG\", \"body\": \"Automated multi-platform CI/CD release build for $TAG with Linux (x86_64 & ARM64), Windows x64 and macOS binaries. Features hardware-optimized SQR/SQRT root function with decimal precision.\", \"draft\": false}" \
            "$API_URL/releases")
          
          REL_ID=$(echo "$RESP" | jq -r .id 2>/dev/null || echo "null")
          if [ "$REL_ID" = "null" ] || [ -z "$REL_ID" ]; then
            echo "Release might already exist, fetching existing ID for tag $TAG..."
            REL_ID=$(curl -k -s -H "Authorization: token $TOKEN" "$API_URL/releases/tags/$TAG" | jq -r .id)
          fi
          echo "==> Release ID: $REL_ID"
          
          upload_asset() {
            local FILE="$1"
            local NAME="$2"
            if [ -f "$FILE" ]; then
              echo "  -> Uploading $NAME..."
              ASSET_ID=$(curl -k -s -H "Authorization: token $TOKEN" "$API_URL/releases/$REL_ID/assets" | jq -r ".[] | select(.name==\"$NAME\") | .id" 2>/dev/null || echo "")
              if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
                curl -k -s -X DELETE -H "Authorization: token $TOKEN" "$API_URL/releases/$REL_ID/assets/$ASSET_ID" >/dev/null
              fi
              curl -k -s -X POST -H "Authorization: token $TOKEN" \
                -F "attachment=@$FILE;filename=$NAME" \
                "$API_URL/releases/$REL_ID/assets?name=$NAME" >/dev/null
            fi
          }
          
          upload_asset "dist-bin/clack" "clack"
          upload_asset "dist-bin/clack-linux-amd64" "clack-linux-amd64"
          upload_asset "dist-bin/clack-linux-arm64" "clack-linux-arm64"
          upload_asset "dist-bin/clack.exe" "clack.exe"
          upload_asset "dist-bin/clack-windows-amd64.exe" "clack-windows-amd64.exe"
          upload_asset "dist-bin/clack-darwin-arm64" "clack-darwin-arm64"
          upload_asset "dist-bin/clack-darwin-amd64" "clack-darwin-amd64"

      - name: Send WhatsApp Notification
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          curl -s -X POST http://100.64.0.3:3080/send \
            -H "Content-Type: application/json" \
            -d "{\"to\": \"120363411181500990@g.us\", \"text\": \"🚀 Clack-Basic Release ${TAG} (mit optimierter SQR Wurzelfunktion) wurde soeben vollautomatisch vom neuen Forgejo CI/CD-Runner auf Popel gebaut und veröffentlicht!\n\nBinaries für Linux, Windows und macOS stehen bereit:\nhttps://git.latentforge.dev/${GITHUB_REPOSITORY}/releases/tag/${TAG}\"}" || true
